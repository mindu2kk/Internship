name: AWS Phase 1 validation

on:
  pull_request:
    paths:
      - infrastructure/**
      - SourceCode/deploy/aws/**
      - SourceCode/Dockerfile.backend
      - SourceCode/Dockerfile.proxy
      - SourceCode/deploy/nginx/api.conf
      - SourceCode/requirements.txt
      - .github/workflows/aws-validate.yml
  push:
    branches: [main]
    paths:
      - infrastructure/**
      - SourceCode/deploy/aws/**
      - SourceCode/Dockerfile.backend
      - SourceCode/Dockerfile.proxy
      - SourceCode/deploy/nginx/api.conf
      - SourceCode/requirements.txt
      - .github/workflows/aws-validate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-phase-1-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-and-bootstrap:
    name: Terraform and bootstrap validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
      - name: Format Terraform
        run: terraform fmt -check -recursive infrastructure
      - name: Validate state bootstrap without a backend
        run: |
          terraform -chdir=infrastructure/state-bootstrap init -backend=false
          terraform -chdir=infrastructure/state-bootstrap validate
      - name: Validate release infrastructure without a backend
        run: |
          terraform -chdir=infrastructure/aws init -backend=false
          terraform -chdir=infrastructure/aws validate
      - name: Validate Linux bootstrap scripts
        run: |
          bash -n SourceCode/deploy/aws/refresh.sh
          bash -n SourceCode/deploy/aws/backup.sh
          bash -n SourceCode/deploy/aws/restore.sh
          bash -n SourceCode/deploy/aws/rollback.sh
          if grep -rIU $'\r' infrastructure SourceCode/deploy/aws; then
            echo 'Linux bootstrap files must use LF line endings.' >&2
            exit 1
          fi
      - name: Validate API proxy image and AWS Compose rendering
        run: |
          docker build --file SourceCode/Dockerfile.proxy --tag aura-api-proxy:phase1 SourceCode
          docker run --detach --name aura-api-proxy-smoke -p 18081:8080 aura-api-proxy:phase1
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error http://127.0.0.1:18081/healthz; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              docker logs aura-api-proxy-smoke
              exit 1
            fi
            sleep 1
          done
          docker rm -f aura-api-proxy-smoke
          AWS_REGION=ap-southeast-1 \
          AURA_LOG_GROUP=/aura/ci/app \
          AURA_BACKEND_IMAGE=example.invalid/aura@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          AURA_PROXY_IMAGE=aura-api-proxy:phase1 \
          CLOUDFLARED_IMAGE=cloudflare/cloudflared@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
          CLOUDFLARE_TUNNEL_TOKEN=ci-placeholder \
          docker compose -f SourceCode/deploy/aws/docker-compose.aws.yml config >/dev/null

  x86_64-backend-smoke:
    name: x86_64 backend build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend for the x86_64 architecture
        uses: docker/build-push-action@v6
        with:
          context: ./SourceCode
          file: ./SourceCode/Dockerfile.backend
          platforms: linux/amd64
          tags: aura-backend:x86_64-ci
          load: true
          cache-from: type=gha,scope=x86_64-backend
          cache-to: type=gha,mode=max,scope=x86_64-backend
      - name: Run architecture-specific health and catalog smoke test
        run: |
          wait_for_http() {
            local url="$1"
            local max_attempts="$2"

            for attempt in $(seq 1 "$max_attempts"); do
              if curl --fail --silent --show-error --max-time 5 "$url"; then
                return 0
              fi

              if ! docker inspect --format '{{.State.Running}}' aura-x86_64-smoke | grep -qx true; then
                echo "Container stopped before ${url} became ready." >&2
                docker logs aura-x86_64-smoke || true
                return 1
              fi

              echo "Waiting for ${url} (${attempt}/${max_attempts})..."
              sleep 2
            done

            echo "Timed out waiting for ${url}." >&2
            docker logs aura-x86_64-smoke || true
            return 1
          }

          docker run --detach --rm --name aura-x86_64-smoke --platform linux/amd64 \
            -p 8000:8000 \
            -e ENABLE_EXTERNAL_AI_WORKFLOW=false \
            -e ENABLE_LLM_DECISION_PHRASING=false \
            aura-backend:x86_64-ci
          wait_for_http http://127.0.0.1:8000/health 30
          wait_for_http 'http://127.0.0.1:8000/api/products?limit=1' 10
      - if: always()
        name: Collect x86_64 container logs
        run: |
          docker logs aura-x86_64-smoke || true
          docker rm -f aura-x86_64-smoke || true
