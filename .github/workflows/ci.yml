name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: SourceCode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: SourceCode/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest-cov
      - name: Compile
        run: python -m compileall -q backend
      - name: Test and coverage
        run: >-
          python -m pytest
          tests/test_harness_runtime.py tests/test_agent_verifier.py
          tests/test_query_frame_display_specs.py tests/test_product_reference_resolution.py
          tests/test_harness_preflight.py tests/test_harness_postflight.py
          tests/agent tests/verification/test_config_loader.py tests/test_unit.py
          --cov=backend --cov-report=term-missing --cov-report=xml -q
      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: SourceCode/coverage.xml
          if-no-files-found: error

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: SourceCode/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SourceCode/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker build and smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BACKEND_IMAGE: aura-backend:ci
      FRONTEND_IMAGE: aura-frontend:ci
      HTTP_PORT: '8080'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./SourceCode
          file: ./SourceCode/Dockerfile.backend
          platforms: linux/amd64
          tags: aura-backend:ci
          load: true
          cache-from: type=gha,scope=x86_64-backend
          cache-to: type=gha,mode=max,scope=x86_64-backend
      - uses: docker/build-push-action@v7
        with:
          context: ./SourceCode
          file: ./SourceCode/Dockerfile.frontend
          tags: aura-frontend:ci
          load: true
          cache-from: type=gha,scope=ci-frontend
          cache-to: type=gha,mode=max,scope=ci-frontend
      - name: Start exact CI images
        run: docker compose -f SourceCode/docker-compose.production.yml up -d --wait
      - name: Smoke test public and API paths
        run: |
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:8080/healthz
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:8080/api/products?limit=1
      - if: always()
        run: docker compose -f SourceCode/docker-compose.production.yml logs --no-color
      - if: always()
        run: docker compose -f SourceCode/docker-compose.production.yml down -v
