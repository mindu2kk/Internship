name: AWS release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment. Production requires GitHub Environment approval.
        required: true
        type: choice
        options: [staging, production]
      confirmation:
        description: Type RELEASE after the calculator and staging gates are approved.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, publish, and refresh ${{ inputs.environment }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
      ECR_PROXY_REPOSITORY: ${{ vars.ECR_PROXY_REPOSITORY }}
      SSM_BACKEND_RELEASE_PARAMETER: ${{ vars.SSM_BACKEND_RELEASE_PARAMETER }}
      SSM_PROXY_RELEASE_PARAMETER: ${{ vars.SSM_PROXY_RELEASE_PARAMETER }}
      PROJECT: aura
    steps:
      - name: Enforce release gates before cloud actions
        run: |
          test "${{ inputs.confirmation }}" = "RELEASE"
          test "${{ vars.PHASE_1_COST_GATE }}" = "approved"
          test -n "$AWS_REGION"
          test -n "$ECR_BACKEND_REPOSITORY"
          test -n "$ECR_PROXY_REPOSITORY"
          test -n "$SSM_BACKEND_RELEASE_PARAMETER"
          test -n "$SSM_PROXY_RELEASE_PARAMETER"
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish immutable x86_64 backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./SourceCode
          file: ./SourceCode/Dockerfile.backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:sha-${{ github.sha }}
      - name: Build and publish immutable x86_64 API proxy image
        id: proxy
        uses: docker/build-push-action@v6
        with:
          context: ./SourceCode
          file: ./SourceCode/Dockerfile.proxy
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_PROXY_REPOSITORY }}:sha-${{ github.sha }}
      - name: Point SSM release parameters to exact image digests
        run: |
          aws ssm put-parameter --overwrite --type String \
            --name "$SSM_BACKEND_RELEASE_PARAMETER" \
            --value "${{ steps.ecr.outputs.registry }}/$ECR_BACKEND_REPOSITORY@${{ steps.backend.outputs.digest }}"
          aws ssm put-parameter --overwrite --type String \
            --name "$SSM_PROXY_RELEASE_PARAMETER" \
            --value "${{ steps.ecr.outputs.registry }}/$ECR_PROXY_REPOSITORY@${{ steps.proxy.outputs.digest }}"
      - name: Refresh only the tagged target instance through Session Manager
        id: refresh
        run: |
          instance_id="$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=$PROJECT" "Name=tag:Environment,Values=${{ inputs.environment }}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          test -n "$instance_id"
          test "$(wc -w <<< "$instance_id")" -eq 1

          # user_data runs only on first boot. Sync the Terraform-managed
          # bootstrap artifacts on every immutable release so EC2 cannot keep
          # an obsolete GHCR-era refresh script or Compose definition.
          remote_command_file="$RUNNER_TEMP/aura-bootstrap-sync.sh"
          remote_parameters_file="$RUNNER_TEMP/aura-bootstrap-sync-parameters.json"
          cat > "$remote_command_file" <<'EOF'
          set -Eeuo pipefail
          source /etc/aura/deploy.env
          test -n "$AWS_REGION"
          test -n "$BACKUP_BUCKET"

          sync_asset() {
            local asset="$1"
            local destination="$2"
            AWS_USE_DUALSTACK_ENDPOINT=true aws s3 cp \
              "s3://${BACKUP_BUCKET}/bootstrap/${asset}" "$destination" \
              --region "$AWS_REGION" --only-show-errors
          }

          install -d -m 0750 /srv/aura /etc/aura
          sync_asset docker-compose.aws.yml /srv/aura/docker-compose.aws.yml
          sync_asset aura-refresh /usr/local/bin/aura-refresh
          sync_asset aura-backup /usr/local/bin/aura-backup
          sync_asset aura-restore /usr/local/bin/aura-restore
          sync_asset aura-rollback /usr/local/bin/aura-rollback
          chmod 0700 /usr/local/bin/aura-refresh /usr/local/bin/aura-backup \
            /usr/local/bin/aura-restore /usr/local/bin/aura-rollback

          exec /usr/local/bin/aura-refresh
          EOF
          jq -n --rawfile command "$remote_command_file" '{commands: [$command]}' > "$remote_parameters_file"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$instance_id" \
            --parameters "file://$remote_parameters_file" \
            --query 'Command.CommandId' --output text)"
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
      - name: Wait for the instance-side health gate
        run: |
          # The AWS CLI waiter stops after about 100 seconds.  A first pull of
          # the immutable backend image can legitimately take longer, so poll
          # SSM explicitly while retaining a bounded release timeout.
          deadline=$((SECONDS + 1200))
          while true; do
            status="$(aws ssm get-command-invocation \
              --command-id "${{ steps.refresh.outputs.command_id }}" \
              --instance-id "${{ steps.refresh.outputs.instance_id }}" \
              --query 'Status' --output text 2>/dev/null || true)"

            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "${{ steps.refresh.outputs.command_id }}" \
                  --instance-id "${{ steps.refresh.outputs.instance_id }}" \
                  --query '{status:Status,response_code:ResponseCode,finished_at:ExecutionEndDateTime}' \
                  --output json
                break
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "${{ steps.refresh.outputs.command_id }}" \
                  --instance-id "${{ steps.refresh.outputs.instance_id }}" \
                  --output json
                exit 1
                ;;
              Pending|InProgress|Delayed|'')
                ;;
              *)
                echo "Unexpected SSM command status: $status" >&2
                exit 1
                ;;
            esac

            if (( SECONDS >= deadline )); then
              echo "Timed out waiting 20 minutes for the staging refresh command." >&2
              exit 1
            fi
            echo "Staging refresh status: $status"
            sleep 15
          done
