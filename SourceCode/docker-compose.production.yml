services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable image reference}
    restart: unless-stopped
    # CI runs without a secret file; deployed environments provide this file.
    env_file:
      - path: .env
        required: false
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    volumes:
      - aura_chroma:/app/chroma_db
      - aura_chat:/app/chat.db
      - aura_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to an immutable image reference}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  aura_chroma:
  aura_chat:
  aura_logs:
