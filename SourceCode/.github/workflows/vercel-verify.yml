name: Verify Vercel production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  production-health:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the Vercel deployment serving the validated commit
        env:
          VERCEL_PRODUCTION_URL: ${{ vars.VERCEL_PRODUCTION_URL }}
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          test -n "$VERCEL_PRODUCTION_URL"
          test -n "$BACKEND_HEALTH_URL"
          curl --fail --retry 12 --retry-delay 5 "$VERCEL_PRODUCTION_URL/"
          curl --fail --retry 12 --retry-delay 5 "$BACKEND_HEALTH_URL/health"
