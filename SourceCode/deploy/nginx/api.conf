server {
    listen 8080;
    server_name _;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream http://backend:8000;

    location = /healthz {
        access_log off;
        # The ALB must observe application health, not merely the Nginx
        # process. If FastAPI is unavailable, return its failure upstream so
        # this target is removed from service instead of accepting bad traffic.
        proxy_pass $backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
