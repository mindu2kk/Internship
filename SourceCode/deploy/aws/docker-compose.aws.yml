services:
  backend:
    image: ${AURA_BACKEND_IMAGE:?Set an immutable backend image digest}
    restart: unless-stopped
    env_file:
      - ${AURA_RUNTIME_ENV:-./runtime.env.example}
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-https://www.invalid}
    volumes:
      - /srv/aura/data/chroma:/app/chroma_db
      - /srv/aura/logs:/app/logs
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?Set AWS_REGION}
        awslogs-group: ${AURA_LOG_GROUP:?Set AURA_LOG_GROUP}
        awslogs-stream: backend
        awslogs-create-group: "false"
        awslogs-endpoint: https://logs.${AWS_REGION}.api.aws
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  api-proxy:
    image: ${AURA_PROXY_IMAGE:?Set an immutable API proxy image digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?Set AWS_REGION}
        awslogs-group: ${AURA_LOG_GROUP:?Set AURA_LOG_GROUP}
        awslogs-stream: nginx
        awslogs-create-group: "false"
        awslogs-endpoint: https://logs.${AWS_REGION}.api.aws

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?Set a reviewed cloudflared image digest}
    restart: unless-stopped
    command: tunnel --no-autoupdate --edge-ip-version 6 --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set Cloudflare Tunnel token}
    depends_on:
      api-proxy:
        condition: service_started
    network_mode: host
    extra_hosts:
      - "api-proxy:127.0.0.1"
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?Set AWS_REGION}
        awslogs-group: ${AURA_LOG_GROUP:?Set AURA_LOG_GROUP}
        awslogs-stream: cloudflared
        awslogs-create-group: "false"
        awslogs-endpoint: https://logs.${AWS_REGION}.api.aws
